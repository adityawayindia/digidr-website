<div class="digidr-modal" id="missionModal" aria-hidden="true">
    <div class="digidr-modal__overlay" data-modal-close></div>
    <div class="digidr-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="missionModalTitle">
        <button class="digidr-modal__close" type="button" aria-label="Close" data-modal-close>
            <span class="material-symbols-outlined">close</span>
        </button>

        <h2 class="digidr-modal__title" id="missionModalTitle">Your digital identity is waiting.<br><span class="text-highlight-blue">Let’s build it.</span></h2>

        <form class="go-digital-form" action="#" method="post">
            <div class="row">
                <div class="col-md-6">
                    <div class="go-digital-field">
                        <label class="go-digital-label" for="missionFullName">Full Name</label>
                        <input class="go-digital-input" id="missionFullName" name="fullName" type="text" placeholder="Sarah Smith" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="go-digital-field">
                        <label class="go-digital-label" id="missionSpecialityLabel" for="missionSpeciality">Your speciality</label>
                        <div class="go-digital-select" data-custom-select>
                            <select class="go-digital-select__native" id="missionSpeciality" name="speciality" required tabindex="-1" aria-hidden="true">
                                <option value="" disabled selected>Select your speciality</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Dermatology">Dermatology</option>
                                <option value="Paediatrics">Paediatrics</option>
                                <option value="Orthopaedics">Orthopaedics</option>
                                <option value="General Medicine">General Medicine</option>
                                <option value="Other">Other</option>
                            </select>
                            <button type="button" class="go-digital-select__trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="missionSpecialityLabel">
                                <span class="go-digital-select__value is-placeholder">Select your speciality</span>
                                <span class="go-digital-select__icon material-symbols-outlined" aria-hidden="true">expand_more</span>
                            </button>
                            <ul class="go-digital-select__menu" role="listbox" aria-labelledby="missionSpecialityLabel" hidden></ul>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="go-digital-field">
                        <label class="go-digital-label" for="missionEmail">Email</label>
                        <input class="go-digital-input" id="missionEmail" name="email" type="email" placeholder="xyz@gmail.com" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="go-digital-field">
                        <label class="go-digital-label" for="missionPhone">Phone Number</label>
                        <input class="go-digital-input" id="missionPhone" name="phone" type="tel" placeholder="+1234567890" pattern="[0-9+]+" maxlength="14" oninput="this.value = this.value.replace(/[^0-9+]/g, '');" required>
                    </div>
                </div>
            </div>

            <div class="go-digital-actions">
                <button class="go-digital-btn go-digital-btn-primary" type="submit">
                    <span class="material-symbols-outlined">arrow_forward</span>
                    Book A Free Demo
                </button>

        </form>
    </div>
