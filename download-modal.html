<div class="digidr-modal download-modal" id="downloadModal" aria-hidden="true">
    <div class="digidr-modal__overlay" data-download-modal-close></div>
    <div class="digidr-modal__dialog download-modal__dialog" role="dialog" aria-modal="true"
        aria-labelledby="downloadModalTitle">
        <button class="digidr-modal__close" type="button" aria-label="Close" data-download-modal-close>
            <span class="material-symbols-outlined">close</span>
        </button>

        <p class="download-modal__eyebrow">Start free trial</p>
        <h2 class="digidr-modal__title download-modal__title" id="downloadModalTitle">Choose your platform</h2>
        <p class="download-modal__subtitle">Continue with DigiDr on your preferred platform.</p>

        <div class="download-modal-options">
            <a class="download-modal-option download-modal-option--web" href="https://web.digidr.app/" target="_blank"
                rel="noopener noreferrer">
                <span class="download-modal-option__icon material-symbols-outlined"
                    aria-hidden="true">desktop_mac</span>
                <span class="download-modal-option__content">
                    <span class="download-modal-option__title">Web App</span>
                    <span class="download-modal-option__meta">Open in Browser</span>
                </span>
            </a>

            <a class="download-modal-option" href="https://play.google.com/store/apps/details?id=com.wayindia.digidrapp"
                target="_blank" rel="noopener noreferrer">
                <span class="download-modal-option__icon download-modal-option__store-icon" aria-hidden="true">
                    <img src="img/play_store.png" alt="Google Play Store icon">
                </span>
                <span class="download-modal-option__content">
                    <span class="download-modal-option__title">Google Play</span>
                    <span class="download-modal-option__meta">Get it for Android</span>
                </span>
            </a>

            <button class="download-modal-option" disabled>
                <span class="download-modal-option__icon download-modal-option__store-icon" aria-hidden="true">
                    <img src="img/app_store.png" alt="Apple App Store icon">
                </span>
                <span class="download-modal-option__content">
                    <span class="download-modal-option__title">App Store</span>
                    <span class="download-modal-option__meta">Get it for iOS</span>
                </span>
            </button>
        </div>
    </div>
</div>
